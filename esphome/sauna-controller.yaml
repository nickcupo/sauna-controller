esphome:
  name: sauna-controller
  platform: ESP32
  board: esp32dev
  # Store setpoint and heat state in flash
  on_boot:
    priority: 600
    then:
      - lambda: |-
          auto restore = id(thermostat_climate).make_call();
          restore.set_mode("HEAT");
          restore.perform();

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Static IP (optional - set enable_on_boot to true to use)

  # Enable IPv4 only for stability
  enable_ipv6: false

  # Fallback hotspot if WiFi fails
  ap:
    ssid: !secret wifi_ssid
    password: !secret ap_password

# Captive portal for fallback AP
captive_portal:

# Enable logging
logger:
  level: INFO

# Enable Home API (not just for HA - used by ESPHome dashboard)
api:
  encryption:
    key: !secret api_encryption_key

# OTA Updates
ota:
  - platform: esphome
    password: !secret wifi_password

# mDNS
mdns:
  disabled: false

# Web Server
web_server:
  port: 80
  auth:
    username: admin
    password: !secret wifi_password

# I2C Bus for OLED
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 100kHz  # Start at standard speed, can lower if needed

# Dallas Temperature Sensor
dallas:
  - pin: GPIO15
    update_interval: 30s

# Global variables for control
globals:
  - id: encoder_adjustment_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_interaction
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: flash_state
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: bulb_cycles
    type: int[3]
    restore_value: yes
    initial_value: '{0, 0, 0}'

# Fonts for display
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_medium
    size: 16
  - file: "gfonts://Roboto@700"
    id: font_large
    size: 24

# OLED Display
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    rotation: 180  # Matches your setRotation(2)
    update_interval: 1s
    lambda: |-
      // Current Temperature - Line 1
      it.printf(0, 0, id(font_large), "%.0f°F", id(sauna_temp).state);

      // Setpoint - Line 2
      if (id(encoder_adjustment_mode)) {
        // Flash the setpoint when adjusting
        if (id(flash_state)) {
          it.printf(0, 28, id(font_large), ">%.0f°F<", id(thermostat_climate).target_temperature);
        }
        // Show hint at bottom
        it.printf(0, 52, id(font_small), "Rotate to adjust");
      } else {
        // Normal display
        it.printf(0, 28, id(font_medium), "Set: %.0f°F", id(thermostat_climate).target_temperature);

        // Show heating status
        if (id(heat_relay_1).state || id(heat_relay_2).state || id(heat_relay_3).state) {
          int bulbs_on = 0;
          if (id(heat_relay_1).state) bulbs_on++;
          if (id(heat_relay_2).state) bulbs_on++;
          if (id(heat_relay_3).state) bulbs_on++;
          it.printf(0, 52, id(font_small), "Heating: %d bulbs", bulbs_on);
        }
      }

# Sensors
sensor:
  # Temperature Sensor
  - platform: dallas
    address: 0x0000000000000000  # Will auto-detect if only one sensor
    id: sauna_temp
    name: "Sauna Temperature"
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 9.0 / 5.0 + 32.0;  # Convert C to F

  # Rotary Encoder
  - platform: rotary_encoder
    id: encoder
    pin_a: GPIO25  # CLK
    pin_b: GPIO26  # DT
    resolution: 1
    min_value: 100
    max_value: 200
    publish_initial_value: false
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(encoder_adjustment_mode);'
            then:
              - climate.control:
                  id: thermostat_climate
                  target_temperature: !lambda 'return x;'
              - lambda: |-
                  id(last_interaction) = millis();
                  ESP_LOGI("encoder", "Setpoint adjusted to %.0f°F", x);

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "Sauna WiFi Signal"
    update_interval: 60s

  # Uptime
  - platform: uptime
    name: "Sauna Uptime"
    id: uptime_sec

# Binary Sensors
binary_sensor:
  # Rotary Encoder Button
  - platform: gpio
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
      inverted: true
    id: encoder_button
    filters:
      - delayed_on: 50ms  # Debounce
    on_press:
      then:
        - lambda: |-
            // Toggle adjustment mode
            id(encoder_adjustment_mode) = !id(encoder_adjustment_mode);

            if (id(encoder_adjustment_mode)) {
              // Entering adjustment mode
              ESP_LOGI("ui", "Entered SET MODE");
              id(last_interaction) = millis();
              id(flash_state) = true;
              // Sync encoder value to current setpoint
              auto call = id(encoder).make_call();
              call.set_value((int)id(thermostat_climate).target_temperature);
              call.perform();
            } else {
              // Exiting adjustment mode - save setpoint
              ESP_LOGI("ui", "Exited SET MODE - setpoint saved");
            }

# Output switches for relays
switch:
  # Relay 1 (Bulb Group 1)
  - platform: gpio
    pin: GPIO12
    id: heat_relay_1
    name: "Bulb Group 1"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(bulb_cycles)[0]++;'

  # Relay 2 (Bulb Group 2)
  - platform: gpio
    pin: GPIO13
    id: heat_relay_2
    name: "Bulb Group 2"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(bulb_cycles)[1]++;'

  # Relay 3 (Bulb Group 3)
  - platform: gpio
    pin: GPIO14
    id: heat_relay_3
    name: "Bulb Group 3"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(bulb_cycles)[2]++;'

# Climate/Thermostat Control
climate:
  - platform: thermostat
    id: thermostat_climate
    name: "Sauna Thermostat"
    sensor: sauna_temp

    # Default setpoint
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 160°F
        mode: heat

    # Deadband (hysteresis)
    heat_deadband: 2.0°F      # ±2°F around setpoint
    heat_overrun: 0.5°F       # Slightly overshoot to reduce cycles

    min_heating_off_time: 15s  # Match your MIN_ON_OFF_MS
    min_heating_run_time: 15s
    min_idle_time: 15s

    # Temperature limits
    visual_min_temperature: 100°F
    visual_max_temperature: 200°F
    visual_temperature_step: 1°F

    # Heating actions - proportional control based on temperature
    heat_action:
      - lambda: |-
          // Proportional heating based on temperature deficit
          float error = id(thermostat_climate).target_temperature - id(sauna_temp).state;

          ESP_LOGI("thermostat", "Error: %.1f°F", error);

          // Determine how many bulbs to turn on
          int target_bulbs = 0;
          if (error >= 15.0) {
            target_bulbs = 3;  // 15°F+ below = MAX heat
            ESP_LOGI("thermostat", "%.1f°F below - 3 bulbs (MAX)", error);
          } else if (error >= 10.0) {
            target_bulbs = 2;  // 10-15°F below = MED heat
            ESP_LOGI("thermostat", "%.1f°F below - 2 bulbs (MED)", error);
          } else if (error >= 5.0) {
            target_bulbs = 1;  // 5-10°F below = LOW heat
            ESP_LOGI("thermostat", "%.1f°F below - 1 bulb (LOW)", error);
          } else {
            target_bulbs = 1;  // Just above deadband = 1 bulb
            ESP_LOGI("thermostat", "%.1f°F below - 1 bulb (maintain)", error);
          }

          // Apply bulb states (simple version - can add wear leveling later)
          id(heat_relay_1).turn_on();
          if (target_bulbs >= 2) {
            id(heat_relay_2).turn_on();
          } else {
            id(heat_relay_2).turn_off();
          }
          if (target_bulbs >= 3) {
            id(heat_relay_3).turn_on();
          } else {
            id(heat_relay_3).turn_off();
          }

    idle_action:
      - switch.turn_off: heat_relay_1
      - switch.turn_off: heat_relay_2
      - switch.turn_off: heat_relay_3
      - lambda: 'ESP_LOGI("thermostat", "Idle - all bulbs OFF");'

# Timers and periodic tasks
interval:
  # Flash display in adjustment mode
  - interval: 300ms
    then:
      - lambda: |-
          if (id(encoder_adjustment_mode)) {
            id(flash_state) = !id(flash_state);
          }

  # Auto-exit adjustment mode after 10 seconds
  - interval: 1s
    then:
      - lambda: |-
          if (id(encoder_adjustment_mode)) {
            if (millis() - id(last_interaction) > 10000) {
              id(encoder_adjustment_mode) = false;
              ESP_LOGI("ui", "Adjustment mode timeout - saved");
            }
          }

# Text sensors for status info
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Sauna IP Address"
    ssid: !secret wifi_ssid
      name: "Sauna WiFi SSID"

  - platform: version
    name: "Sauna ESPHome Version"

# Status LED (optional - using onboard LED)
status_led:
  pin:
    number: GPIO2
    inverted: false
